    promises: ['Answers based *only on your documents.*', 'We define with you *what data the AI uses.*', 'A dashboard to see *answers and costs.*', 'Calibration and *ongoing tuning.*'],

const COPY = copy[SC.LANG];

/* A document: name, title, text lines, a total row. */
function doc(x, y, w, h, name, title, seed, o = {}) {
  card(x, y, w, h, 12 * U);
  mono(name, x + 16 * U, y + 24 * U, 14 * U, C.muted, 'left', 500, 0.02);
  ctx.fillStyle = C.line; ctx.fillRect(x + 16 * U, y + 44 * U, w - 32 * U, 1);
  mono(title, x + 16 * U, y + 72 * U, 20 * U, C.text, 'left', 700, 0.14);
  textBars(x + 16 * U, y + 100 * U, w - 32 * U, Math.max(2, Math.floor((h - 190 * U) / (24 * U))), 24 * U, seed);
  ctx.fillStyle = C.line; ctx.fillRect(x + 16 * U, y + h - 60 * U, w - 32 * U, 1);
  ctx.fillStyle = 'rgba(214,226,245,0.32)'; ctx.fillRect(x + w - 16 * U - w * 0.32, y + h - 40 * U, w * 0.32, 12 * U);
  if (o.rows) o.rows.forEach(([ry, on]) => { if (on > 0) { ctx.strokeStyle = o.rowCol || C.cyan; ctx.globalAlpha *= on; ctx.lineWidth = 2 * U; ctx.strokeRect(x + 10 * U, y + ry - 12 * U, w - 20 * U, 24 * U); ctx.globalAlpha /= on; } });
}

/* ================================================================ HOOK — documents pile up */
const DOC_POS = LAND
  ? [[0.02, 0.04, -6], [0.22, 0.18, 4], [0.45, 0.02, -3], [0.64, 0.22, 6], [0.10, 0.50, 3], [0.55, 0.52, -5]]
  : [[0.00, 0.00, -6], [0.40, 0.04, 5], [0.10, 0.28, 3], [0.48, 0.34, -4], [0.02, 0.58, -2], [0.42, 0.64, 6]];
function hook(t) {
  const dw = LAND ? 320 * U : 360 * U, dh = dw * 1.3;
  const out = E.inExpo(prog(t, 3.55, 4.0));
  COPY.docs.forEach((name, i) => {
    const [px, py, rot] = DOC_POS[i];
    const st = 0.1 + i * 0.25, e = E.outBack(prog(t, st, st + 0.45));
    if (e <= 0) return;
    const x = BOX.x + px * (BOX.w - dw * 0.5), y = BOX.y + py * (BOX.h - dh * 0.5);
    ctx.save();
    ctx.globalAlpha = clamp(e) * (1 - out) * (1 - 0.55 * E.outCubic(prog(t, 1.7, 2.2)));
    ctx.translate(x + dw / 2, y + dh / 2 + Math.sin(t * 0.9 + i) * 6 * U - (1 - clamp(e)) * 160 * U - out * 60 * U);
    ctx.rotate((rot + (1 - e) * 12) * Math.PI / 180);
    doc(-dw / 2, -dh / 2, dw, dh, name, COPY.docTitle[i], 40 + i);
    ctx.restore();
  });
}

/* ================================================================ PAIN A — typing an invoice field by field */
function painA(t) {
  const [a, b] = PAIN_T[0], R = REG.vis, k = visIn(t, a, b);
  if (k <= 0) return;
  const dw = Math.min(R.w * 0.36, 300 * U), dh = Math.min(R.h * 0.9, dw * 1.35);
  const fw = Math.min(R.w - dw - 40 * U, 520 * U), total = dw + 40 * U + fw;
  const x0 = R.x + (R.w - total) / 2, y0 = R.y + (R.h - dh) / 2 + (1 - k) * 60 * U;
  const n = COPY.fields.reduce((s, f) => s + f[1].length, 0);
  let typed = Math.floor(prog(t, a + 0.35, a + 1.75) * n);
  const cur = (() => { let c = typed; for (let i = 0; i < 4; i++) { if (c < COPY.fields[i][1].length) return i; c -= COPY.fields[i][1].length; } return 3; })();
  ctx.save(); ctx.globalAlpha = k;
  doc(x0, y0, dw, dh, COPY.docs[0], COPY.docTitle[0], 40, { rows: [[100 * U + cur * 48 * U + 4 * U, 1]] });
  const fx = x0 + dw + 40 * U, fh = 70 * U, fy0 = y0 + (dh - fh * 4 - 60 * U) / 2;
  COPY.fields.forEach(([label, val], i) => {
    const y = fy0 + i * fh;
    mono(label, fx, y + 12 * U, 15 * U, C.muted, 'left', 500, 0.12);
    ctx.strokeStyle = i === cur ? C.cyan : C.line2; ctx.lineWidth = 1.5 * U; ctx.strokeRect(fx, y + 26 * U, fw, 38 * U);
    const shown = val.slice(0, clamp(typed, 0, val.length)); typed -= val.length;
    setFont('mono', 22 * U, 500, 0); ctx.fillStyle = C.text; ctx.textBaseline = 'middle';
    ctx.fillText(shown, fx + 12 * U, y + 46 * U);
    const cw = ctx.measureText(shown).width; resetText();
    if (i === cur && Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = C.cyan; ctx.fillRect(fx + 14 * U + cw, y + 33 * U, 3 * U, 26 * U); }
  });
  mono(COPY.counter, fx, fy0 + fh * 4 + 24 * U, 18 * U, C.muted, 'left', 500, 0.06);
  ctx.restore();
}

/* ================================================================ PAIN B — customers asking, nobody answering */
function painB(t) {
  const [a, b] = PAIN_T[1], R = REG.vis, k = visIn(t, a, b);
  if (k <= 0) return;
  const ph = Math.min(R.h * 0.98, 640 * U), pw = ph * 0.52;
  const x = R.x + (R.w - pw) / 2, y = R.y + (R.h - ph) / 2 + (1 - k) * 60 * U;
  ctx.save(); ctx.globalAlpha = k;
  const s = phoneFrame(x, y, pw, ph);
  ctx.fillStyle = C.raised; ctx.fillRect(s.x, s.y, s.w, 56 * U);
  ctx.fillStyle = 'rgba(214,226,245,0.18)'; ctx.beginPath(); ctx.arc(s.x + 32 * U, s.y + 28 * U, 15 * U, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(214,226,245,0.3)'; ctx.fillRect(s.x + 58 * U, s.y + 22 * U, s.w * 0.4, 10 * U);
  let by = s.y + 80 * U, count = 0;
  COPY.chatIn.forEach((m, i) => {
    const st = a + 0.3 + i * 0.32, e = E.outBack(prog(t, st, st + 0.3));
    if (e <= 0) return;
    count++;
    ctx.save(); ctx.globalAlpha *= clamp(e); ctx.translate(0, (1 - e) * 20 * U);
    const bb = bubble(s.x + 16 * U, by, m, { size: 22 * U });
    ctx.restore();
    by += bb.h + 14 * U;
  });
  const sa = prog(t, a + 1.45, a + 1.7);
  if (sa > 0) { ctx.save(); ctx.globalAlpha *= sa; mono(COPY.seen, s.x + 16 * U, by + 10 * U, 15 * U, C.muted, 'left', 500, 0.04); ctx.restore(); }
  if (count) {
    const r = 26 * U * (1 + 0.15 * bp(t)), cx = x + pw - 10 * U, cy = y + 10 * U;
    ctx.fillStyle = C.err; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    setFont('text', 24 * U, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(count), cx, cy + 1); resetText();
  }
  ctx.restore();
}

/* ================================================================ PAIN C — search the PDFs, find nothing */
function painC(t) {
  const [a] = PAIN_T[2], R = REG.vis;
  const k = E.outExpo(prog(t, a + 0.1, a + 0.6));
  if (k <= 0) return;
  const w = Math.min(R.w * 0.9, 620 * U), h = 300 * U;
  const x = R.x + (R.w - w) / 2, y = R.y + (R.h - h) / 2 + 40 * U + (1 - k) * 60 * U;
  ctx.save(); ctx.globalAlpha = k;
  // the pile behind
  for (let i = 4; i >= 0; i--) {
    ctx.save(); ctx.translate(x + w / 2 + (i - 2) * 46 * U, y - 40 * U - i * 6 * U); ctx.rotate((i - 2) * 0.07);
    doc(-110 * U, -150 * U, 220 * U, 280 * U, COPY.docs[i], COPY.docTitle[i], 60 + i);
    ctx.restore();
  }
  const c = panel(x, y, w, h, null, { hb: 0 });
  // search field
  ctx.strokeStyle = C.line2; ctx.lineWidth = 1.5 * U; ctx.strokeRect(x + 24 * U, y + 30 * U, w - 48 * U, 64 * U);
  ctx.strokeStyle = C.muted; ctx.lineWidth = 3 * U; ctx.beginPath(); ctx.arc(x + 56 * U, y + 60 * U, 12 * U, 0, TAU); ctx.moveTo(x + 65 * U, y + 69 * U); ctx.lineTo(x + 76 * U, y + 80 * U); ctx.stroke();
  const q = COPY.search.slice(0, Math.floor(prog(t, a + 0.35, a + 1.0) * COPY.search.length));
  setFont('text', 28 * U, 500); ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.fillText(q, x + 90 * U, y + 63 * U);
  const qw = ctx.measureText(q).width; resetText();
  if (Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = C.cyan; ctx.fillRect(x + 94 * U + qw, y + 46 * U, 3 * U, 34 * U); }
  const ra = E.outExpo(prog(t, a + 1.15, a + 1.5));
  if (ra > 0) {
    ctx.globalAlpha *= ra;
    setFont('display', 40 * U, 800, -0.02); ctx.fillStyle = C.err; ctx.textBaseline = 'middle'; ctx.fillText('0', x + 24 * U, y + 170 * U); resetText();
    mono(COPY.noResults, x + 70 * U, y + 172 * U, 22 * U, C.muted, 'left', 500, 0.08);
    textBars(x + 24 * U, y + 220 * U, w - 48 * U, 2, 26 * U, 9, 0.07);
  }
  ctx.restore();
}

/* ================================================================ SOLUTION — the assistant at work */
function solution(t, D0) {
  const out = E.inExpo(prog(t, 19.65, 20.05));
  const shrink = E.inOutExpo(prog(t, 18.6, 19.1));
  const S0 = fitRect(D0, LAND ? 1.42 : 1.2);
  const sc = lerp(1, 0.78, shrink);
  const S = { x: S0.x + S0.w * (1 - sc) / 2, y: S0.y + (LAND ? S0.h * (1 - sc) / 2 : 0), w: S0.w * sc, h: S0.h * sc };
  const fk = E.outExpo(prog(t, 12.2, 12.7));
  if (fk <= 0) return;
  ctx.save(); ctx.globalAlpha = fk * (1 - out); ctx.translate(0, out * 80 * U + (1 - fk) * 40 * U);
  ctx.translate(S.x, S.y); ctx.scale(sc, sc); ctx.translate(-S.x, -S.y);
  const w = S0.w, h = S0.h, x = S.x, y = S.y, top = 52 * U;
  card(x, y, w, h, 18 * U, C.surface, C.line2);
  ctx.fillStyle = C.raised; cutPath(x, y, w, top, 18 * U); ctx.fill();
  for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(214,226,245,0.18)'; ctx.fillRect(x + 22 * U + i * 18 * U, y + top / 2 - 5 * U, 10 * U, 10 * U); }
  mono('symmetrical / ' + COPY.app, x + 92 * U, y + top / 2, 17 * U, C.muted, 'left', 500, 0.04);
  ctx.save(); ctx.globalAlpha *= 0.6 + 0.4 * bp(t); ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(x + w - 96 * U, y + top / 2, 5 * U, 0, TAU); ctx.fill(); ctx.restore();
  mono(COPY.live, x + w - 84 * U, y + top / 2, 15 * U, C.accent, 'left', 600, 0.14);
  // left: the document being read
  const pad = 28 * U, dw = w * 0.38, dh = h - top - pad * 2, dx = x + pad, dy = y + top + pad;
  const scan = prog(t, 12.6, 14.2);
  const rows = COPY.fields.map((_, i) => [100 * U + i * 48 * U + 4 * U, clamp((scan * 5 - i - 0.3) * 2) * (1 - prog(t, 14.4, 14.7))]);
  doc(dx, dy, dw, dh, COPY.docs[0], COPY.docTitle[0], 40, { rows, rowCol: C.accent });
  if (scan > 0 && scan < 1) {
    const sy = dy + 50 * U + scan * (dh - 80 * U);
    const g = ctx.createLinearGradient(0, sy - 40 * U, 0, sy);
    g.addColorStop(0, acc(0)); g.addColorStop(1, acc(0.35));
    ctx.fillStyle = g; ctx.fillRect(dx, sy - 40 * U, dw, 40 * U);
    ctx.fillStyle = C.accent; ctx.fillRect(dx, sy, dw, 3 * U);
  }
  // right column
  const rx = dx + dw + pad, rw = w - dw - pad * 3, ry = dy;
  const toChat = E.inOutCubic(prog(t, 14.55, 14.95));
  // beat 1 — extracted fields
  if (toChat < 1) {
    ctx.save(); ctx.globalAlpha *= 1 - toChat; ctx.translate(-toChat * 40 * U, 0);
    COPY.fields.forEach(([label, val], i) => {
      const fy = ry + 10 * U + i * Math.min(92 * U, (dh - 20 * U) / 4);
      const fe = E.outExpo(prog(t, 12.75 + i * 0.32, 13.15 + i * 0.32));
      mono(label, rx, fy + 12 * U, 15 * U, C.muted, 'left', 500, 0.12);
      ctx.fillStyle = fe > 0 ? acc(0.10 * fe) : 'transparent'; ctx.fillRect(rx, fy + 26 * U, rw, 44 * U);
      ctx.strokeStyle = fe > 0.02 ? C.accent : C.line2; ctx.lineWidth = 1.5 * U; ctx.strokeRect(rx, fy + 26 * U, rw, 44 * U);
      if (fe > 0) { ctx.save(); ctx.globalAlpha *= fe; setFont('text', 24 * U, 600); ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.fillText(val, rx + 14 * U + (1 - fe) * 30 * U, fy + 49 * U); resetText(); ctx.restore(); }
    });
    ctx.restore();
  }
  // beat 2 — the chat that cites its source
  if (toChat > 0) {
    ctx.save(); ctx.globalAlpha *= toChat; ctx.translate((1 - toChat) * 40 * U, 0);
    const bs = Math.min(22 * U, rw / 17);
    const qk = E.outBack(prog(t, 14.75, 15.05));
    if (qk > 0) { ctx.save(); ctx.globalAlpha *= clamp(qk); bubble(rx + rw, ry + 10 * U, COPY.q, { side: 'out', size: bs }); ctx.restore(); }
    const ak = prog(t, 15.2, 16.1);
    if (ak > 0) {
      const ay = ry + 10 * U + bs * 2.6 + 18 * U;
      const full = COPY.a.join(' '), n = Math.floor(ak * full.length);
      const l1 = COPY.a[0].slice(0, n), l2 = n > COPY.a[0].length ? COPY.a[1].slice(0, n - COPY.a[0].length - 1) : '';
      setFont('text', bs, 500);
      const bw = Math.max(ctx.measureText(COPY.a[0]).width, ctx.measureText(COPY.a[1]).width) + bs * 1.2;
      resetText();
      ctx.fillStyle = C.raised; ctx.beginPath(); ctx.roundRect(rx, ay, bw, bs * 3.4, [bs * 0.6, bs * 0.6, bs * 0.6, 4 * U]); ctx.fill();
      setFont('text', bs, 500); ctx.fillStyle = C.text; ctx.textBaseline = 'middle';
      ctx.fillText(l1, rx + bs * 0.6, ay + bs * 1.15); ctx.fillText(l2, rx + bs * 0.6, ay + bs * 2.35); resetText();
      const ck = E.outBack(prog(t, 16.05, 16.35));
      if (ck > 0) {
        ctx.save(); ctx.globalAlpha *= clamp(ck);
        setFont('mono', 15 * U, 600, 0.04); const cw = ctx.measureText(COPY.cite).width + 26 * U; resetText();
        ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5 * U; ctx.strokeRect(rx, ay + bs * 3.4 + 14 * U, cw, 32 * U);
        mono(COPY.cite, rx + 13 * U, ay + bs * 3.4 + 30 * U, 15 * U, C.accent, 'left', 600, 0.04);
        ctx.restore();
      }
    }
    ctx.restore();
  }
  ctx.restore();
  // beat 3 — privacy card over the workspace
  const pk = E.outExpo(prog(t, 16.65, 17.15)) * (1 - E.inExpo(prog(t, 18.3, 18.6)));
  if (pk > 0) {
    const cw = Math.min(S0.w * 0.7, 560 * U), rh = 66 * U, chh = 64 * U + rh * 3;
    const cx = S0.x + S0.w - cw + 20 * U + (1 - pk) * 120 * U, cy = S0.y + S0.h - chh + 30 * U;
    ctx.save(); ctx.globalAlpha = pk * (1 - out);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40 * U; ctx.shadowOffsetY = 16 * U;
    card(cx, cy, cw, chh, 14 * U, C.raised, C.line2); ctx.shadowColor = 'transparent';
    lockIcon(cx + 34 * U, cy + 34 * U, 26 * U, C.accent);
    ctx.fillStyle = C.line; ctx.fillRect(cx + 20 * U, cy + 62 * U, cw - 40 * U, 1);
    COPY.privacy.forEach((p, i) => {
      const ry2 = cy + 64 * U + i * rh + rh / 2, st = 16.95 + i * 0.25;
      checkNode(cx + 22 * U, ry2, 32 * U, E.outBack(prog(t, st, st + 0.3)), prog(t, st + 0.1, st + 0.35));
      setFont('text', 22 * U, 500); ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.fillText(p, cx + 70 * U, ry2); resetText();
    });
    ctx.restore();
  }
  // beat 4 — the channels it plugs into
  const ck4 = E.outExpo(prog(t, 18.75, 19.25));
  if (ck4 > 0) {
    ctx.save(); ctx.globalAlpha = ck4 * (1 - out); ctx.translate(0, out * 80 * U);
    const n = COPY.channels.length, chw = Math.min(S0.w / 3 - 20 * U, 240 * U), chh2 = 62 * U;
    const cy2 = LAND ? S.y + S.h + 26 * U : S.y + S.h + 40 * U;
    COPY.channels.forEach((ch, i) => {
      const cx2 = S0.x + (S0.w - (n * chw + (n - 1) * 20 * U)) / 2 + i * (chw + 20 * U);
      const e = E.outBack(prog(t, 18.8 + i * 0.12, 19.15 + i * 0.12));
      if (e <= 0) return;
      ctx.save(); ctx.translate(0, (1 - e) * 30 * U);
      const q = (t * 1.4 + i / 3) % 1;
      ctx.fillStyle = C.accent; ctx.fillRect(cx2 + chw / 2 - 3 * U, lerp(S.y + S.h, cy2, q) - 3 * U, 6 * U, 6 * U);
      ctx.strokeStyle = acc(0.5); ctx.lineWidth = 1.5 * U; ctx.beginPath(); ctx.moveTo(cx2 + chw / 2, S.y + S.h); ctx.lineTo(cx2 + chw / 2, cy2); ctx.stroke();
      card(cx2, cy2, chw, chh2, 10 * U, C.raised, C.accent);
      setFont('text', Math.min(22 * U, chw / 8), 600); ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ch, cx2 + chw / 2, cy2 + chh2 / 2); resetText();
      ctx.restore();
    });
    ctx.restore();
  }
}

/* ================================================================ SOUND */
function sfx(at, N) {
  for (let i = 0; i < 6; i++) at(0.1 + i * 0.25, (V, w) => V.thud(w, 0.36));                  // documents land
  for (let k = 0; k < 20; k++) at(4.35 + k * 0.07, (V, w) => V.key(w));                        // typing fields
  for (let i = 0; i < 4; i++) at(6.3 + i * 0.32, (V, w) => V.pluck(w, N.E5, 0.05));             // messages arrive
  at(7.45, (V, w) => V.stab(w, [N.A3, N.B3, N.F4], 0.045));                                    // seen, no reply
  for (let k = 0; k < 10; k++) at(8.35 + k * 0.065, (V, w) => V.key(w));                       // search typing
  at(9.15, (V, w) => V.thud(w, 0.6));                                                          // "0 results"
  for (let i = 0; i < 4; i++) at(12.75 + i * 0.32, (V, w) => V.pluck(w, [N.C5, N.E5, N.G5, N.C6][i], 0.06)); // fields extracted
  at(14.75, (V, w) => V.pluck(w, N.G5, 0.06)); at(16.05, (V, w) => V.bell(w, N.E5, 0.06));      // question, cited answer
  for (let i = 0; i < 3; i++) at(16.95 + i * 0.25, (V, w) => V.tick(w, 0.05));                  // privacy checks
  at(18.75, (V, w) => V.whoosh(w, 0.45, 0.18));                                                 // channels
}

SC.run({ copy, accent: '#a855f7', accentRgb: [168, 85, 247], hook, pains: [painA, painB, painC], solution, sfx });
