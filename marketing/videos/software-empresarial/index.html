function hook(t) {

  COPY.files.forEach((name, i) => {

    const st = 0.1 + i * 0.25, e = E.outBack(prog(t, st, st + 0.45));
    if (e <= 0) return;
    const x = BOX.x + px * (BOX.w - cw * 0.55), y = BOX.y + py * (BOX.h - ch * 0.6);
    const drift = Math.sin(t * 0.9 + i) * 6 * U;
    ctx.save();
    ctx.globalAlpha = clamp(e) * (1 - out) * (1 - 0.55 * E.outCubic(prog(t, 1.7, 2.2)));

    ctx.scale(lerp(0.9, 1, clamp(e)) * (1 - out * 0.1), lerp(0.9, 1, clamp(e)) * (1 - out * 0.1));

}

const MOD_DATA = [0, 1, 2, 3, 4].map(m => { const r = rng(100 + m); return Array.from({ length: 12 }, () => 0.25 + 0.75 * r()); });
/* Element rects of the dashboard, in dashboard-relative units, so cells can fly into them. */
function dashParts(D) {
  const top = Math.max(40 * U, D.h * 0.085), side = D.w * 0.27, pad = D.w * 0.03;
  const mx = D.x + side + pad, mw = D.w - side - pad * 2, my = D.y + top + pad;
  const kh = D.h * 0.17, kw = (mw - pad * 2) / 3;
  const chY = my + kh + pad, chH = D.h * 0.33;
  const tbY = chY + chH + pad, tbH = D.y + D.h - pad - tbY;

  for (let i = 0; i < 5; i++) parts.push({ kind: 'mod', i, x: D.x + pad * 0.6, y: D.y + top + pad + i * D.h * 0.1, w: side - pad * 1.2, h: D.h * 0.075 });
  for (let i = 0; i < 3; i++) parts.push({ kind: 'kpi', i, x: mx + i * (kw + pad), y: my, w: kw, h: kh });

  for (let i = 0; i < 3; i++) parts.push({ kind: 'row', i, x: mx, y: tbY + i * tbH / 3, w: mw, h: tbH / 3 - 6 * U });

function activeModule(t) {

      const flipAt = 17.2 + (i * 2 + j) * 0.18;
      const on = startP[i][j] !== finalP[i][j] ? (t > flipAt ? finalP[i][j] : startP[i][j]) : finalP[i][j];
      const sw = E.outExpo(prog(t, flipAt, flipAt + 0.2));

  const data = MOD_DATA[0], bw = (sw - 28 * U) / data.length, base = sy + sh * 0.62;

function solution(t, D0) {
  // device beat: dashboard steps back, phone joins
  const dv = E.inOutExpo(prog(t, 18.6, 19.1));
  const out = E.inExpo(prog(t, 19.65, 20.05));
  const sc = lerp(1, 0.8, dv);
  const D = { x: D0.x, y: D0.y + D0.h * (1 - sc) * 0.5, w: D0.w * sc, h: D0.h * sc };
  ctx.save();
  ctx.globalAlpha = 1 - out;
  ctx.translate(0, out * 80 * U);
  // cells fly in from where the spreadsheets were and become the system
  const { parts } = dashParts(D);
  const fly = (idx, p) => {
    const st = 12.15 + idx * 0.04, pe = E.outExpo(prog(t, st, st + 0.7));
    return prog(t, st + 0.45, st + 0.75) * (pe > 0 ? 1 : 0);

  drawDashboard(D, t, fly);
  parts.forEach((p, idx) => {
    const st = 12.15 + idx * 0.04, pe = E.outExpo(prog(t, st, st + 0.7));
    if (pe <= 0 || pe >= 1) return;
    const r = rng(500 + idx), sx = BOX.x + r() * BOX.w, sy = r() < 0.5 ? -60 * U : H + 60 * U;
    const cs = 26 * U;

  const pk = E.outExpo(prog(t, 18.75, 19.2));

    const ph = D0.h * 0.82, pw = ph * 0.5;
    const px = BOX.x + BOX.w - pw, py = D0.y + D0.h - ph * 0.92 + (1 - pk) * 120 * U;
    for (let i = 0; i < 4; i++) {
      const q = ((t * 1.6 + i / 4) % 1);
      const ax = D.x + D.w * 0.7, ay = D.y + D.h * 0.45, bx = px + pw * 0.3, by = py + ph * 0.4;

    }
    ctx.globalAlpha = 1 - out;
    phone(px, py, pw, ph, t, pk);
  }
  ctx.restore();
}

function sfx(at, N) {
  for (let i = 0; i < 6; i++) at(0.1 + i * 0.25, (V, w) => V.thud(w, 0.42));                 // a thud per spreadsheet
  for (let k = 0; k < 16; k++) at(4.35 + k * 0.066, (V, w) => V.key(w));                      // double entry: typing
  at(5.5, (V, w) => V.pluck(w, N.E5, 0.08));
  for (let i = 0; i < 3; i++) at(6.35 + i * 0.18, (V, w) => V.tick(w, 0.06));                 // stock counters
  at(7.15, (V, w) => V.stab(w, [N.A3, N.B3, N.F4], 0.05));                                     // the "?"
  at(8.5, (V, w) => V.thud(w, 0.75)); at(9.5, (V, w) => V.thud(w, 0.75));                      // block bumps
  for (let i = 0; i < 12; i++) at(12.2 + i * 0.08, (V, w) => V.pluck(w, [N.C5, N.E5, N.G5, N.C6][i % 4] / (i < 6 ? 2 : 1), 0.05)); // cells snap in
  for (let i = 1; i < 5; i++) at(14.6 + i * BEAT, (V, w) => V.pluck(w, [N.C5, N.D5, N.E5, N.G5][i - 1], 0.08)); // module switches
  for (let i = 0; i < 6; i++) at(17.2 + i * 0.18, (V, w) => V.tick(w, 0.05));                 // permission toggles
  at(18.75, (V, w) => V.whoosh(w, 0.45, 0.18));                                                 // phone joins
}

const COPY = copy[LANG];
SC.run({ copy, accent: '#4ade80', accentRgb: [74, 222, 128], hook, pains: [painA, painB, painC], solution, sfx });
