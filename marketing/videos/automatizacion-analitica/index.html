/* A system box with a name; returns its center. */
function sysBox(cx, cy, w, h, name, on) {
  card(cx - w / 2, cy - h / 2, w, h, 12 * U, C.raised, on ? C.accent : C.line2);
  setFont('text', Math.min(24 * U, w / 9), 600); ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, cx, cy + 1); resetText();
}
function sysLayout(R) {
  const w = Math.min(R.w * 0.42, 280 * U), h = 84 * U;
  return [[R.x + R.w / 2, R.y + R.h * 0.18], [R.x + R.w * 0.22, R.y + R.h * 0.78], [R.x + R.w * 0.78, R.y + R.h * 0.78]].map(([x, y]) => ({ x, y, w, h }));
}

/* ================================================================ HOOK — the inbox flood */
function hook(t) {
  const out = E.inExpo(prog(t, 3.55, 4.0));
  const k = E.outExpo(prog(t, 0.05, 0.5));
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k * (1 - out) * (1 - 0.55 * E.outCubic(prog(t, 1.7, 2.2)));
  const ph = Math.min(BOX.h * (LAND ? 0.98 : 0.72), 860 * U), pw = ph * 0.5;
  const px = BOX.cx - pw / 2, py = BOX.cy - ph / 2;
  const s = phoneFrame(px, py, pw, ph);
  ctx.save(); ctx.beginPath(); ctx.rect(s.x, s.y, s.w, s.h); ctx.clip();
  const shown = Math.floor(prog(t, 0.2, 3.2) * 20);
  const bs = Math.min(22 * U, s.w / 14), step = bs * 2.5;
  for (let i = 0; i < shown; i++) {
    const yy = s.y + s.h - 20 * U - (shown - i) * step + (1 - E.outExpo(prog(t, 0.2 + (i + 1) * 0.15, 0.4 + (i + 1) * 0.15))) * step;
    if (yy < s.y - step) continue;
    bubble(s.x + 14 * U, yy, COPY.flood[i % COPY.flood.length], { size: bs });
  }
  ctx.restore();
  // floating copies around the phone
  for (let i = 0; i < 6; i++) {
    const st = 0.4 + i * 0.35, e = E.outBack(prog(t, st, st + 0.3));
    if (e <= 0) continue;
    const side = i % 2 ? 1 : -1, fx = BOX.cx + side * (pw / 2 + 40 * U + hash(i, 4) * 60 * U), fy = BOX.y + BOX.h * (0.12 + 0.13 * i);
    ctx.save(); ctx.globalAlpha *= clamp(e) * 0.85;
    const txt = COPY.flood[(i * 3) % COPY.flood.length];
    // keep every bubble inside the safe area, whatever the language or format
    setFont('text', 24 * U, 500); const bw = ctx.measureText(txt).width + 24 * U * 1.1; resetText();
    if (side > 0) bubble(Math.min(fx, BOX.x + BOX.w - bw), fy, txt, { size: 24 * U });
    else bubble(Math.max(fx, BOX.x + bw), fy, txt, { size: 24 * U, side: 'out', fill: C.raised });
    ctx.restore();
  }
  // unread counter
  const n = Math.min(99, Math.floor(prog(t, 0.2, 3.2) * 27) + 1);
  const r = 34 * U * (1 + 0.12 * bp(t)), cx = px + pw - 8 * U, cy = py + 8 * U;
  ctx.fillStyle = C.err; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  setFont('text', 28 * U, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(n), cx, cy + 1); resetText();
  ctx.restore();
}

/* ================================================================ PAIN A — sending confirmations one at a time */
function painA(t) {
  const [a, b] = PAIN_T[0], R = REG.vis, k = visIn(t, a, b);
  if (k <= 0) return;
  const rh = 72 * U, w = Math.min(R.w * 0.9, 580 * U), h = 46 * U + 28 * U + rh * 5 + 40 * U;
  const x = R.x + (R.w - w) / 2, y = R.y + (R.h - h) / 2 + (1 - k) * 60 * U;
  ctx.save(); ctx.globalAlpha = k;
  const c = panel(x, y, w, h, null);
  const done = Math.floor(prog(t, a + 0.4, a + 1.8) * 4);
  COPY.contacts.forEach((name, i) => {
    const ry = c.y + i * rh + rh / 2 - 30 * U;
    if (i) { ctx.fillStyle = C.line; ctx.fillRect(c.x, ry - rh / 2, c.w, 1); }
    ctx.fillStyle = 'rgba(214,226,245,0.14)'; ctx.beginPath(); ctx.arc(c.x + 20 * U, ry, 20 * U, 0, TAU); ctx.fill();
    setFont('text', 22 * U, 500); ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.fillText(name, c.x + 54 * U, ry); resetText();
    const bw = 130 * U, bx = c.x + c.w - bw;
    if (i < done) mono(COPY.sent, bx + bw, ry, 16 * U, C.muted, 'right', 600, 0.08);
    else { ctx.strokeStyle = i === done ? C.text : C.line2; ctx.lineWidth = 1.5 * U; ctx.strokeRect(bx, ry - 20 * U, bw, 40 * U); mono(COPY.send, bx + bw / 2, ry, 16 * U, C.text, 'center', 600, 0.08); }
    if (i === done) {
      const cx = bx + bw * 0.6, cy = ry + 6 * U, click = ((t - a - 0.4) * 4 / 1.4) % 1;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + 24 * U); ctx.lineTo(cx + 7 * U, cy + 18 * U); ctx.lineTo(cx + 17 * U, cy + 17 * U); ctx.closePath(); ctx.fill();
      if (click > 0 && click < 0.4) { ctx.strokeStyle = `rgba(230,236,245,${1 - click / 0.4})`; ctx.lineWidth = 2 * U; ctx.beginPath(); ctx.arc(cx, cy, 8 * U + click * 60 * U, 0, TAU); ctx.stroke(); }
    }
  });
  mono(`${done} ${COPY.of}`, c.x, y + h - 30 * U, 18 * U, C.muted, 'left', 600, 0.06);
  ctx.restore();
}

/* ================================================================ PAIN B — copy, paste, repeat */
function painB(t) {
  const [a, b] = PAIN_T[1], R = REG.vis, k = visIn(t, a, b);
  if (k <= 0) return;
  const gap = 40 * U, sw = Math.min((R.w - gap) / 2, 320 * U), sh = sw * 1.05;
  const x0 = R.x + (R.w - sw * 2 - gap) / 2, y = R.y + (R.h - sh) / 2 + 20 * U + (1 - k) * 60 * U;
  ctx.save(); ctx.globalAlpha = k;
  const sheets = [[x0, COPY.sheetA], [x0 + sw + gap, COPY.sheetB]];
  const cells = [];
  sheets.forEach(([sx, name], si) => {
    const c = panel(sx, y, sw, sh, name, { titleSize: 15 * U });
    const cw = c.w / 3, ch = c.h / 6;
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(c.x + i * cw, c.y); ctx.lineTo(c.x + i * cw, c.y + c.h); ctx.stroke(); }
    for (let j = 0; j <= 6; j++) { ctx.beginPath(); ctx.moveTo(c.x, c.y + j * ch); ctx.lineTo(c.x + c.w, c.y + j * ch); ctx.stroke(); }
    cells.push({ c, cw, ch });
  });
  // the same cell travels from one sheet to the other, over and over
  const cyc = ((t - a - 0.2) / 0.45), i = Math.floor(cyc), q = cyc - i;
  if (t > a + 0.2) {
    const A = cells[0], B = cells[1], r = i % 5;
    const fx = A.c.x + (r % 3) * A.cw, fy = A.c.y + (1 + (r % 4)) * A.ch, tx = B.c.x + ((r + 1) % 3) * B.cw, ty = B.c.y + (1 + ((r + 2) % 4)) * B.ch;
    const e = E.inOutCubic(clamp(q / 0.7));
    ctx.fillStyle = 'rgba(2,224,251,0.35)'; ctx.fillRect(lerp(fx, tx, e), lerp(fy, ty, e), A.cw, A.ch);
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 2 * U; ctx.strokeRect(lerp(fx, tx, e), lerp(fy, ty, e), A.cw, A.ch);
    const label = q < 0.35 ? 'Ctrl + C' : 'Ctrl + V';
    setFont('mono', 18 * U, 700, 0.04); const lw = ctx.measureText(label).width + 24 * U; resetText();
    const lx = x0 + sw + gap / 2 - lw / 2, ly = y - 56 * U;
    card(lx, ly, lw, 40 * U, 8 * U, C.raised, C.line2); mono(label, lx + lw / 2, ly + 20 * U, 18 * U, C.text, 'center', 700, 0.04);
  }
  mono(COPY.monday, x0, y - 36 * U, 16 * U, C.muted, 'left', 600, 0.12);
  ctx.restore();
}

/* ================================================================ PAIN C — three systems, no connection */
function painC(t) {
  const [a] = PAIN_T[2], R = REG.vis;
  const k = E.outExpo(prog(t, a + 0.1, a + 0.6));
  if (k <= 0) return;
  const P = sysLayout(R);
  ctx.save(); ctx.globalAlpha = k;
  [[0, 1], [1, 2], [2, 0]].forEach(([i, j], n) => {
    const e = prog(t, a + 0.5 + n * 0.25, a + 0.8 + n * 0.25); if (e <= 0) return;
    const A = P[i], B = P[j], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    ctx.strokeStyle = 'rgba(214,226,245,0.25)'; ctx.lineWidth = 2 * U; ctx.setLineDash([10 * U, 8 * U]);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(lerp(A.x, mx, 0.8), lerp(A.y, my, 0.8)); ctx.moveTo(B.x, B.y); ctx.lineTo(lerp(B.x, mx, 0.8), lerp(B.y, my, 0.8)); ctx.stroke(); ctx.setLineDash([]);
    ctx.save(); ctx.globalAlpha *= e; ctx.strokeStyle = C.err; ctx.lineWidth = 4 * U; const s = 12 * U;
    ctx.beginPath(); ctx.moveTo(mx - s, my - s); ctx.lineTo(mx + s, my + s); ctx.moveTo(mx + s, my - s); ctx.lineTo(mx - s, my + s); ctx.stroke(); ctx.restore();
  });
  P.forEach((p, i) => { const e = E.outBack(prog(t, a + 0.1 + i * 0.12, a + 0.4 + i * 0.12)); if (e > 0) { ctx.save(); ctx.globalAlpha *= clamp(e); sysBox(p.x, p.y, p.w * e, p.h, COPY.systems[i], false); ctx.restore(); } });
  ctx.restore();
}

/* ================================================================ SOLUTION — flows that run on their own */
function node(x, y, w, h, label, on, sub) {
  card(x, y, w, h, 10 * U, on > 0 ? acc(0.14 * on) : C.raised, on > 0.5 ? C.accent : C.line2);
  setFont('text', Math.min(22 * U, w / (label.length * 0.62)), 600); ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1); resetText();
  if (sub) mono(sub, x + w / 2, y - 14 * U, 13 * U, on > 0.5 ? C.accent : C.muted, 'center', 600, 0.14);
}
function pulse(x1, y1, x2, y2, t, on = 1) {
  ctx.strokeStyle = on > 0 ? acc(0.35 + 0.5 * on) : C.line2; ctx.lineWidth = 2.5 * U;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (on <= 0) return;
  for (let i = 0; i < 2; i++) { const q = (t * 1.5 + i / 2) % 1; ctx.fillStyle = C.accent; ctx.fillRect(lerp(x1, x2, q) - 5 * U, lerp(y1, y2, q) - 5 * U, 10 * U, 10 * U); }
}
function solution(t, D0) {
  const out = solOut(t);
  const S = fitRect(D0, LAND ? 1.45 : 1.2);
  const fk = E.outExpo(prog(t, 12.2, 12.7));
  if (fk <= 0) return;
  ctx.save(); ctx.globalAlpha = fk * (1 - out); ctx.translate(0, out * 80 * U + (1 - fk) * 40 * U);
  const c = appWindow(S.x, S.y, S.w, S.h, 'symmetrical / ' + COPY.app, t);
  ctx.fillStyle = 'rgba(214,226,245,0.05)';
  for (let gx = c.x; gx < c.x + c.w; gx += 24 * U) for (let gy = c.y; gy < c.y + c.h; gy += 24 * U) ctx.fillRect(gx, gy, 2 * U, 2 * U);
  // beat 1 — trigger → action → the customer's phone
  let k = beatK(t, 0);
  if (k > 0) {
    ctx.save(); ctx.globalAlpha *= k;
    const nw = c.w * 0.36, nh = 70 * U, nx = c.x, ny1 = c.y + c.h * 0.16, ny2 = c.y + c.h * 0.56;
    node(nx, ny1, nw, nh, COPY.trigger, prog(t, 12.6, 12.8), 'TRIGGER');
    pulse(nx + nw / 2, ny1 + nh, nx + nw / 2, ny2, t, prog(t, 12.8, 13.0));
    node(nx, ny2, nw, nh, COPY.action, prog(t, 13.0, 13.2), 'WHATSAPP');
    const ph = c.h, pw = ph * 0.5, px = c.x + c.w - pw, py = c.y;
    pulse(nx + nw, ny2 + nh / 2, px, ny2 + nh / 2, t, prog(t, 13.2, 13.4));
    const s = phoneFrame(px, py, pw, ph, { shadow: false });
    const bk = E.outBack(prog(t, 13.4, 13.7));
    if (bk > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(bk); ctx.translate(0, (1 - bk) * 20 * U);
      const bs = Math.min(18 * U, s.w / 16);
      const b1 = bubble(s.x + 12 * U, s.y + 40 * U, COPY.notif[0], { size: bs, fill: acc(0.22) });
      bubble(s.x + 12 * U, s.y + 52 * U + b1.h, COPY.notif[1], { size: bs, fill: acc(0.22) });
      ctx.restore();
    }
    ctx.restore();
  }
  // beat 2 — a sale ripples through the whole chain
  k = beatK(t, 1);
  if (k > 0) {
    ctx.save(); ctx.globalAlpha *= k;
    const n = COPY.chain.length, vertical = !LAND;
    const nw = vertical ? c.w * 0.6 : (c.w - 20 * U * (n - 1)) / n, nh = vertical ? Math.min(64 * U, (c.h - 24 * U * (n - 1)) / n) : 80 * U;
    const pos = i => vertical ? [c.x + (c.w - nw) / 2, c.y + i * (nh + (c.h - nh * n) / (n - 1))] : [c.x + i * (nw + 20 * U), c.y + (c.h - nh) / 2];
    COPY.chain.forEach((l, i) => {
      const on = prog(t, 14.85 + i * 0.28, 15.05 + i * 0.28);
      const [x, y] = pos(i);
      if (i) { const [px, py] = pos(i - 1); vertical ? pulse(px + nw / 2, py + nh, x + nw / 2, y, t, on) : pulse(px + nw, py + nh / 2, x, y + nh / 2, t, on); }
      node(x, y, nw, nh, l, on);
      if (on > 0) checkNode(vertical ? x + nw + 16 * U : x + nw - 34 * U, vertical ? y + nh / 2 : y - 24 * U, 28 * U, E.outBack(on), prog(t, 15.0 + i * 0.28, 15.2 + i * 0.28));
    });
    ctx.restore();
  }
  // beat 3 — the three systems, connected
  k = beatK(t, 2);
  if (k > 0) {
    ctx.save(); ctx.globalAlpha *= k;
    const P = sysLayout(c);
    [[0, 1], [1, 2], [2, 0]].forEach(([i, j], n) => pulse(P[i].x, P[i].y, P[j].x, P[j].y, t, prog(t, 16.9 + n * 0.25, 17.15 + n * 0.25)));
    P.forEach((p, i) => sysBox(p.x, p.y, p.w, p.h, COPY.systems[i], t > 16.9 + i * 0.25));
    ctx.restore();
  }
  // beat 4 — live numbers
  k = beatK(t, 3);
  if (k > 0) {
    ctx.save(); ctx.globalAlpha *= k;
    const kw = (c.w - 20 * U) / 2, kh = 110 * U;
    COPY.kpis.forEach(([label, v], i) => {
      const x = c.x + i * (kw + 20 * U);
      card(x, c.y, kw, kh, 10 * U, C.raised, null);
      mono(label, x + 18 * U, c.y + 28 * U, 14 * U, C.muted, 'left', 600, 0.1);
      const val = Math.round(v * (0.82 + 0.18 * E.outCubic(prog(t, 18.7, 19.6))));
      setFont('display', Math.min(44 * U, kw / 6), 800, -0.02); ctx.fillStyle = i ? C.text : C.accent; ctx.textBaseline = 'middle';
      ctx.fillText((i ? '' : '$') + val.toLocaleString('en-US'), x + 18 * U, c.y + 74 * U); resetText();
    });
    const gy = c.y + kh + 30 * U, gh = c.h - kh - 30 * U, draw = E.outCubic(prog(t, 18.7, 19.5));
    ctx.fillStyle = C.line; ctx.fillRect(c.x, gy + gh, c.w, 1);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3.5 * U; ctx.beginPath();
    const N = 40;
    for (let i = 0; i <= N * draw; i++) {
      const u = i / N, v = 0.2 + 0.55 * u + 0.1 * Math.sin(u * 11 + 1) + 0.04 * Math.sin(u * 37);
      const px = c.x + u * c.w, py = gy + gh - v * gh * 0.9;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ================================================================ SOUND */
function sfx(at, N) {
  for (let i = 0; i < 18; i++) at(0.35 + i * 0.16, (V, w) => V.pluck(w, [N.E5, N.G5, N.A5][i % 3], 0.03)); // the flood
  for (let i = 0; i < 4; i++) at(4.4 + i * 0.35, (V, w) => V.tick(w, 0.06));                  // clicking "send"
  at(5.55, (V, w) => V.stab(w, [N.A3, N.B3, N.F4], 0.04));                                     // "of 40"
  for (let i = 0; i < 4; i++) at(6.2 + i * 0.45, (V, w) => V.key(w));                          // ctrl+c / ctrl+v
  for (let i = 0; i < 3; i++) at(8.5 + i * 0.25, (V, w) => V.thud(w, 0.45));                   // broken links
